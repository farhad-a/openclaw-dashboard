services:
  dashboard:
    image: ghcr.io/mudrii/openclaw-dashboard:edge
    container_name: openclaw-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config.json:/app/config.json:ro
      - ${OPENCLAW_HOME:-~/.openclaw}:/home/dashboard/.openclaw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
