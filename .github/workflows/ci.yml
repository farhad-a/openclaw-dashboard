name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install test dependencies
        run: pip install pytest

      - name: Run static analysis tests (no server needed)
        run: python -m pytest tests/test_frontend.py tests/test_critical.py tests/test_dockerfile.py tests/test_nix_flake.py -v

      - name: Run schema tests
        run: python -m pytest tests/test_data_schema.py -v
        continue-on-error: true
        # data.json only exists after refresh.sh runs against a real OpenClaw install

      - name: Run server integration tests
        run: python -m pytest tests/test_server.py tests/test_chat.py tests/test_hierarchy_recent.py -v

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install dependencies
        run: pip install pytest pytest-timeout playwright

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run E2E tests
        run: python -m pytest tests/test_e2e.py -v --timeout=30

  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Check refresh.sh
        run: shellcheck --severity=warning refresh.sh

      - name: Check install.sh
        run: shellcheck --severity=warning install.sh || true

      - name: Check uninstall.sh
        run: shellcheck --severity=warning uninstall.sh || true
